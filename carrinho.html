<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrinho – DUBLON</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <style>
    .cart-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 28px;
      background: var(--gray-50);
      min-height: calc(100vh - 56px);
    }

    .cart-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 20px;
    }

    /* Cart items */
    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cart-item {
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }

    .cart-item-img {
      width: 72px;
      height: 72px;
      background: var(--gray-100);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-cat {
      font-size: 10px;
      font-weight: 700;
      color: var(--blue-vibrant);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .cart-item-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .cart-item-spec {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .cart-item-qty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .cart-item-qty .qty-counter {
      border-radius: var(--radius-md);
    }

    .cart-item-qty .qty-counter input {
      width: 50px;
    }

    .cart-item-price {
      text-align: right;
      flex-shrink: 0;
    }

    .cart-item-price .unit {
      font-size: 11px;
      color: var(--text-muted);
    }

    .cart-item-price .total {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .cart-item-remove {
      color: var(--gray-400);
      font-size: 16px;
      cursor: pointer;
      transition: color var(--transition);
      margin-left: 12px;
      background: none;
      border: none;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    .cart-item-remove:hover { color: #EF4444; background: #FEE2E2; }

    /* Summary */
    .cart-summary {
      position: sticky;
      top: 80px;
      height: fit-content;
    }

    .summary-card {
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: var(--shadow-md);
    }

    .summary-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .summary-row:last-of-type { border-bottom: none; }

    .summary-row .label { color: var(--text-secondary); }
    .summary-row .value { font-weight: 600; color: var(--text-primary); }

    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 8px;
      margin-top: 4px;
      border-top: 2px solid var(--border-color);
    }

    .summary-total .label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .summary-total .value {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .coupon-row {
      display: flex;
      gap: 8px;
      margin: 16px 0;
    }

    .coupon-row input {
      flex: 1;
      padding: 9px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 13px;
      outline: none;
    }
    .coupon-row input:focus { border-color: var(--blue-vibrant); }

    .coupon-row button {
      padding: 9px 14px;
      background: var(--gray-100);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }
    .coupon-row button:hover { border-color: var(--blue-vibrant); color: var(--blue-vibrant); }

    .summary-note {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body class="page-wrapper">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">
        <img src="/assets/images/dublon_logo_transparente.png" alt="Dublon" style="height:36px;display:block;">
      </a>
      <ul class="navbar-links">
        <li><a href="catalogo.html">Produtos</a></li>
        <li><a href="sobre.html">Serviços</a></li>
        <li><a href="sobre.html">Sobre</a></li>
      </ul>
      <div class="navbar-search">
        <span class="search-icon">🔍</span>
        <input type="search" placeholder="Buscar produto..." />
      </div>
      <div class="navbar-actions">
        <a href="contato.html" class="navbar-btn-contact">Contato</a>
        <a href="login.html" class="navbar-btn-login"><span>👤</span> Entrar</a>
        <a href="orcamento.html" class="navbar-btn-quote">Solicitar Orçamento</a>
        <a href="rastreamento.html" class="navbar-btn-track"><span>📦</span> Acompanhe seu pedido</a>
      </div>
    </div>
  </nav>

  <div style="background:var(--gray-50);min-height:calc(100vh - 56px);">
    <div class="cart-page">
      <!-- Items -->
      <div>
        <h1 class="cart-title">🛒 Meu Carrinho</h1>
        <div class="cart-items">
          <div style="padding:40px; text-align:center;">
            Carregando o seu carrinho...
          </div>
        </div>

        <div style="margin-top:20px;">
          <a href="catalogo.html" style="font-size:13px;color:var(--blue-vibrant);text-decoration:none;font-weight:600;">← Continuar comprando</a>
        </div>
      </div>

      <!-- Summary -->
      <div class="cart-summary">
        <div class="summary-card">
          <div class="summary-title">Resumo do pedido</div>

          <div class="summary-row">
            <span class="label">Subtotal (0 pares)</span>
            <span class="value">R$ 0,00</span>
          </div>
          <div class="summary-row">
            <span class="label">Frete</span>
            <span class="value" style="color:#16A34A;">Grátis</span>
          </div>
          <div class="summary-row">
            <span class="label">Desconto</span>
            <span class="value">—</span>
          </div>

          <div class="coupon-row">
            <input type="text" placeholder="Código de cupom" id="coupon-input" />
            <button onclick="applyCoupon()">Aplicar</button>
          </div>

          <div class="summary-total">
            <span class="label">Total</span>
            <span class="value">R$ 0,00</span>
          </div>

          <button class="btn btn-primary btn-full" style="padding:14px;font-size:15px;margin-top:4px;" onclick="window.location.href='checkout.html'">
            → Finalizar pedido
          </button>

          <p class="summary-note">🔒 Pagamento 100% seguro</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!window.API) return;

      const { CartAPI, CouponsAPI, Format, Toast } = window.API;

      const cartItemsContainer = document.querySelector('.cart-items');
      const subtotalLabel = document.querySelector('.summary-row:nth-of-type(1) .value');
      const subtotalTitleLabel = document.querySelector('.summary-row:nth-of-type(1) .label');
      const discountLabel = document.querySelector('.summary-row:nth-of-type(3) .value');
      const totalLabel = document.querySelector('.summary-total .value');
      const checkoutBtn = document.querySelector('.btn-primary');

      let cartData = null;
      let appliedCoupon = null;

      async function loadCart() {
        try {
          cartData = await CartAPI.get();
          renderCart(cartData);
        } catch (e) {
          console.error(e);
          cartItemsContainer.innerHTML = '<div style="padding:40px; text-align:center;">Erro ao carregar o carrinho.</div>';
        }
      }

      function renderCart(data) {
        const items = data.items || [];
        
        if (items.length === 0) {
          cartItemsContainer.innerHTML = `
            <div style="padding:48px; text-align:center; color:var(--text-secondary); background:#fff; border:1px solid var(--border-color); border-radius:var(--radius-xl);">
              <span style="font-size:48px;">🛒</span>
              <p style="margin-top:16px; font-weight:600; font-size:16px;">Seu carrinho está vazio</p>
              <p style="font-size:13px; color:var(--text-muted); margin-bottom:20px;">Adicione produtos do catálogo para solicitar ou realizar um pedido.</p>
              <a href="catalogo.html" class="btn btn-primary btn-sm">Ver Catálogo</a>
            </div>
          `;
          subtotalTitleLabel.textContent = 'Subtotal (0 pares)';
          subtotalLabel.textContent = Format.currency(0);
          totalLabel.textContent = Format.currency(0);
          discountLabel.textContent = '—';
          checkoutBtn.disabled = true;
          return;
        }

        checkoutBtn.disabled = false;
        cartItemsContainer.innerHTML = '';
        
        let totalPairs = 0;

        items.forEach(item => {
          totalPairs += parseInt(item.quantity);
          const card = document.createElement('div');
          card.className = 'cart-item';
          card.innerHTML = `
            <div class="cart-item-img" style="background:#F8FAFC; width: 72px; height: 72px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0;">
              ${item.image_url ? `<img src="${item.image_url}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;" />` : '👟'}
            </div>
            <div class="cart-item-info" style="flex: 1; margin-left: 16px;">
              <div class="cart-item-cat" style="font-size: 10px; font-weight: 700; color: var(--blue-vibrant); text-transform: uppercase; margin-bottom: 3px;">${item.category_name || 'Geral'}</div>
              <div class="cart-item-name" style="font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;">${item.name}</div>
              <div class="cart-item-spec" style="font-size: 12px; color: var(--text-secondary);">Cor: <span style="display:inline-block;width:12px;height:12px;border-radius:50%;background-color:${item.color};border:1px solid #ddd;vertical-align:middle;"></span> · Tamanho: ${item.size}</div>
            </div>
            <div class="cart-item-qty" style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
              <div class="qty-counter">
                <button onclick="changeQty(${item.id}, -1)">−</button>
                <input type="number" value="${item.quantity}" min="${item.stock_min || 50}" onchange="updateQty(${item.id}, this.value)" id="qty-${item.id}" />
                <button onclick="changeQty(${item.id}, 1)">+</button>
              </div>
              <span style="font-size:11px;color:var(--text-muted);">${Format.currency(item.price)}/par</span>
            </div>
            <div class="cart-item-price" style="text-align: right; flex-shrink: 0; margin-left: 16px;">
              <div class="unit" style="font-size: 11px; color: var(--text-muted);">Subtotal</div>
              <div class="total" style="font-size: 18px; font-weight: 800; color: var(--text-primary);">${Format.currency(item.price * item.quantity)}</div>
            </div>
            <button class="cart-item-remove" onclick="removeItem(${item.id})" title="Remover">✕</button>
          `;
          cartItemsContainer.appendChild(card);
        });

        subtotalTitleLabel.textContent = `Subtotal (${totalPairs} pares)`;
        recalculateTotals(data.subtotal);
      }

      window.changeQty = async (id, delta) => {
        const input = document.getElementById(`qty-${id}`);
        if (!input) return;
        let newQty = parseInt(input.value) + delta;
        const min = parseInt(input.min) || 50;
        if (newQty < min) newQty = min;
        input.value = newQty;
        await updateQty(id, newQty);
      };

      window.updateQty = async (id, val) => {
        const qty = parseInt(val);
        try {
          const res = await CartAPI.update(id, qty);
          await loadCart();
          if (window.API.updateCartBadge) {
            window.API.updateCartBadge();
          }
        } catch (err) {
          Toast.error(err.message || 'Erro ao atualizar quantidade.');
          await loadCart();
        }
      };

      window.removeItem = async (id) => {
        try {
          await CartAPI.remove(id);
          Toast.success('Item removido do carrinho.');
          await loadCart();
          if (window.API.updateCartBadge) {
            window.API.updateCartBadge();
          }
        } catch (err) {
          Toast.error(err.message || 'Erro ao remover item.');
        }
      };

      function recalculateTotals(subtotal) {
        subtotalLabel.textContent = Format.currency(subtotal);
        let finalDiscount = 0;

        if (appliedCoupon) {
          if (appliedCoupon.discount_type === 'percentage') {
            finalDiscount = (subtotal * parseFloat(appliedCoupon.discount_value)) / 100;
          } else {
            finalDiscount = parseFloat(appliedCoupon.discount_value);
          }
          discountLabel.textContent = `-${Format.currency(finalDiscount)}`;
          discountLabel.style.color = '#16A34A';
        } else {
          discountLabel.textContent = '—';
          discountLabel.style.color = '';
        }

        const finalTotal = Math.max(0, subtotal - finalDiscount);
        totalLabel.textContent = Format.currency(finalTotal);
      }

      window.applyCoupon = async () => {
        const codeInput = document.getElementById('coupon-input');
        const code = codeInput.value.trim();

        if (!code) {
          Toast.warn('Por favor, insira o código de cupom.');
          return;
        }

        if (!cartData || !cartData.subtotal) return;

        try {
          const res = await CouponsAPI.validate(code, cartData.subtotal);
          appliedCoupon = res.coupon;
          sessionStorage.setItem('applied_coupon', JSON.stringify(appliedCoupon));
          Toast.success('Cupom aplicado com sucesso!');
          recalculateTotals(cartData.subtotal);
        } catch (err) {
          Toast.error(err.message || 'Cupom inválido ou expirado.');
          appliedCoupon = null;
          sessionStorage.removeItem('applied_coupon');
          recalculateTotals(cartData.subtotal);
        }
      };

      const savedCoupon = sessionStorage.getItem('applied_coupon');
      if (savedCoupon) {
        try {
          appliedCoupon = JSON.parse(savedCoupon);
          document.getElementById('coupon-input').value = appliedCoupon.code;
        } catch (e) {
          sessionStorage.removeItem('applied_coupon');
        }
      }

      await loadCart();
    });
  </script>
</body>
</html>

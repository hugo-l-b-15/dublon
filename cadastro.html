<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Conta – DUBLON Palmilhas Industriais</title>
  <meta name="description" content="Crie sua conta DUBLON para acompanhar pedidos, solicitar orçamentos e muito mais." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    body {
      background: linear-gradient(135deg, var(--blue-dark) 0%, #0D2046 50%, #1B3A6E 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 40px 20px;
    }

    body::before {
      content: '';
      position: absolute;
      width: 800px; height: 800px;
      background: radial-gradient(circle, rgba(37,99,235,0.2) 0%, transparent 70%);
      top: -200px; right: -200px;
      pointer-events: none;
    }

    .register-card {
      background: var(--white);
      border-radius: var(--radius-2xl);
      box-shadow: 0 25px 50px rgba(0,0,0,0.35);
      padding: 48px 40px;
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 1;
    }

    .register-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .register-logo span {
      font-size: 22px;
      font-weight: 800;
      color: var(--blue-primary);
    }

    .register-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 6px;
    }

    .register-sub {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 28px;
    }

    .register-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .register-footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 20px;
    }
    .register-footer a {
      color: var(--blue-vibrant);
      font-weight: 600;
      text-decoration: none;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }
    .divider-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px 20px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--white);
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-google:hover {
      border-color: var(--blue-vibrant);
      background: var(--gray-50);
    }

    .terms-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .terms-check input { margin-top: 2px; flex-shrink: 0; }
    .terms-check a { color: var(--blue-vibrant); text-decoration: none; }

    .back-link {
      position: absolute;
      top: 24px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--white); }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← Voltar ao site</a>

  <div class="register-card">
    <div class="register-logo">
      <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="8" fill="#1B3A6E"/>
        <path d="M8 20 L16 10 L24 20 L16 30 Z" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linejoin="round"/>
        <path d="M20 10 L32 16 L32 24 L20 30" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="28" cy="10" r="2" fill="#22D3EE"/>
      </svg>
      <span>DUBLON</span>
    </div>

    <h1 class="register-title">Criar sua conta</h1>
    <p class="register-sub">Preencha os dados abaixo para se cadastrar</p>

    <form class="register-form" onsubmit="handleRegister(event)" id="register-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">NOME</label>
          <input type="text" class="form-control" placeholder="Seu nome" required />
        </div>
        <div class="form-group">
          <label class="form-label">SOBRENOME</label>
          <input type="text" class="form-control" placeholder="Sobrenome" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">E-MAIL</label>
        <div class="form-control-icon">
          <span class="icon">✉</span>
          <input type="email" class="form-control" placeholder="seu@email.com" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">TELEFONE</label>
          <div class="form-control-icon">
            <span class="icon">📞</span>
            <input type="tel" class="form-control" placeholder="(11) 99999-9999" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">CPF</label>
          <input type="text" class="form-control" placeholder="000.000.000-00" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">EMPRESA (OPCIONAL)</label>
        <div class="form-control-icon">
          <span class="icon">🏢</span>
          <input type="text" class="form-control" placeholder="Nome da empresa" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">SENHA</label>
          <div class="form-control-icon">
            <span class="icon">🔒</span>
            <input type="password" class="form-control" placeholder="Mínimo 8 caracteres" required minlength="8" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">CONFIRMAR SENHA</label>
          <div class="form-control-icon">
            <span class="icon">🔒</span>
            <input type="password" class="form-control" placeholder="Repita a senha" required />
          </div>
        </div>
      </div>

      <div class="terms-check">
        <input type="checkbox" id="terms" required />
        <label for="terms">
          Concordo com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a> da DUBLON.
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="padding:13px;font-size:15px;" id="register-submit">
        Criar conta
      </button>

      <div class="divider"><span class="divider-text">ou cadastre-se com</span></div>

      <button type="button" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continuar com Google
      </button>
    </form>

    <p class="register-footer">
      Já tem uma conta? <a href="login.html">Fazer login</a>
    </p>
  </div>

  <script>
    function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('register-submit');
      btn.textContent = 'Criando conta...';
      btn.disabled = true;
      setTimeout(() => {
        window.location.href = 'meus-pedidos.html';
      }, 1200);
    }
  </script>
</body>
</html>

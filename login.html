<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar – DUBLON Palmilhas Industriais</title>
  <meta name="description" content="Acesse sua conta DUBLON para acompanhar pedidos, orçamentos e muito mais." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    body {
      background: linear-gradient(135deg, var(--blue-dark) 0%, #0D2046 50%, #1B3A6E 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 800px; height: 800px;
      background: radial-gradient(circle, rgba(37,99,235,0.2) 0%, transparent 70%);
      top: -200px; right: -200px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(34,211,238,0.07) 0%, transparent 70%);
      bottom: -100px; left: -100px;
      pointer-events: none;
    }

    .login-card {
      background: var(--white);
      border-radius: var(--radius-2xl);
      box-shadow: 0 25px 50px rgba(0,0,0,0.35);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 32px;
    }

    .login-logo img {
      height: 64px;
      width: auto;
      display: block;
      background: none;
      border: none;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .login-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 6px;
    }

    .login-sub {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 32px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .login-footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 24px;
    }

    .login-footer a {
      color: var(--blue-vibrant);
      font-weight: 600;
      text-decoration: none;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }
    .divider-text {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px 20px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--white);
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-google:hover {
      border-color: var(--blue-vibrant);
      background: var(--gray-50);
    }

    .forgot-link {
      text-align: right;
    }
    .forgot-link a {
      font-size: 12px;
      color: var(--blue-vibrant);
      text-decoration: none;
    }
    .forgot-link a:hover { text-decoration: underline; }

    .back-link {
      position: absolute;
      top: 24px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--white); }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← Voltar ao site</a>

  <div class="login-card">
    <div class="login-logo">
      <img src="/assets/images/dublon_logo_final.png" alt="Dublon" style="height:80px;display:block;margin:0 auto;">
    </div>

    <h1 class="login-title">Bem-vindo de volta</h1>
    <p class="login-sub">Entre na sua conta para continuar</p>

    <form class="login-form" onsubmit="handleLogin(event)" id="login-form">
      <div class="form-group">
        <label class="form-label">E-MAIL</label>
        <div class="form-control-icon">
          <span class="icon">✉</span>
          <input type="email" class="form-control" placeholder="seu@email.com" required id="login-email" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">SENHA</label>
        <div class="form-control-icon">
          <span class="icon">🔒</span>
          <input type="password" class="form-control" placeholder="••••••••" required id="login-senha" />
        </div>
      </div>

      <div class="forgot-link">
        <a href="#">Esqueci minha senha</a>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="padding:13px;font-size:15px;" id="login-submit">
        Entrar
      </button>

      <div class="divider">
        <span class="divider-text">ou continue com</span>
      </div>

      <button type="button" class="btn-google" onclick="handleGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continuar com Google
      </button>
    </form>

    <p class="login-footer">
      Não tem uma conta? <a href="cadastro.html">Criar conta</a>
    </p>
    <p class="login-footer" style="margin-top: 12px; font-size: 11px; opacity: 0.8;">
      Área restrita: <a href="admin/dashboard.html" style="color: var(--text-secondary); font-weight: 500;">Painel Administrativo</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Se já estiver logado, redirecionar direto
    (function() {
      const API = window.API;
      if (API && API.Auth.isLoggedIn()) {
        const user = API.Auth.getUser();
        window.location.href = user && user.role === 'admin'
          ? 'admin/dashboard.html'
          : 'meus-pedidos.html';
      }
    })();

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-senha').value;
      const btn = document.getElementById('login-submit');
      const originalText = btn.textContent;

      btn.textContent = 'Entrando...';
      btn.disabled = true;

      try {
        const data = await window.API.AuthAPI.login(email, password);
        window.API.Toast.success('Login efetuado com sucesso!');

        // Obter redirect da URL, se houver
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');

        setTimeout(() => {
          if (data.user.role === 'admin') {
            window.location.href = 'admin/dashboard.html';
          } else if (redirect) {
            window.location.href = decodeURIComponent(redirect);
          } else {
            window.location.href = 'meus-pedidos.html';
          }
        }, 800);
      } catch (err) {
        window.API.Toast.error(err.message || 'E-mail ou senha incorretos.');
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    function handleGoogleLogin() {
      window.API.Toast.info('Login com Google em desenvolvimento.');
    }
  </script>
</body>
</html>

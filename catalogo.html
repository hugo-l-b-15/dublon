<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Produtos – DUBLON</title>
  <meta name="description" content="Explore o catálogo completo de palmilhas industriais DUBLON. EVA, Premium, Esportiva e mais." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <style>
    .catalog-layout {
      display: flex;
      min-height: calc(100vh - 56px);
      background: var(--gray-50);
    }

    /* ── Sidebar filtros ─────────────────────────────────── */
    .catalog-sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--white);
      border-right: 1px solid var(--border-color);
      padding: 24px 0;
    }

    .catalog-sidebar-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 0 20px;
      margin-bottom: 12px;
    }

    .filter-group {
      padding: 0 20px;
      margin-bottom: 24px;
    }

    .filter-group-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      cursor: pointer;
    }

    .filter-option input[type="checkbox"] {
      width: 15px;
      height: 15px;
      cursor: pointer;
      accent-color: var(--blue-vibrant);
    }

    .filter-option label {
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .filter-option:hover label { color: var(--text-primary); }

    .filter-divider {
      height: 1px;
      background: var(--border-color);
      margin: 12px 20px 20px;
    }

    .price-range {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .price-range input[type="range"] {
      width: 100%;
      accent-color: var(--blue-vibrant);
    }

    .price-range-values {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ── Main content ────────────────────────────────────── */
    .catalog-main {
      flex: 1;
      padding: 28px 32px;
    }

    .catalog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .catalog-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .catalog-header p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .catalog-sort {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .catalog-sort label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .catalog-sort select {
      padding: 7px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--text-primary);
      background: var(--white);
      outline: none;
      cursor: pointer;
    }

    /* ── Product grid ────────────────────────────────────── */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product-card {
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-md), box-shadow var(--transition-md);
      cursor: pointer;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .product-card-img {
      height: 160px;
      background: linear-gradient(145deg, var(--gray-100) 0%, var(--gray-50) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      position: relative;
    }

    .product-card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
    }

    .product-card-wishlist {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      background: var(--white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      font-size: 14px;
      border: 1px solid var(--border-color);
      transition: all var(--transition);
    }
    .product-card-wishlist:hover { border-color: #EF4444; color: #EF4444; }

    .product-card-body {
      padding: 16px;
    }

    .product-card-cat {
      font-size: 10px;
      font-weight: 700;
      color: var(--blue-vibrant);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .product-card-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .product-card-specs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .spec-tag {
      padding: 2px 8px;
      background: var(--gray-100);
      border-radius: 100px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .product-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-price {
      display: flex;
      flex-direction: column;
    }

    .product-price-label {
      font-size: 10px;
      color: var(--text-muted);
    }

    .product-price-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .product-price-unit {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .btn-add-cart {
      width: 36px;
      height: 36px;
      background: var(--blue-vibrant);
      color: var(--white);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
      border: none;
    }
    .btn-add-cart:hover {
      background: var(--blue-vivid);
      transform: scale(1.05);
    }
  </style>
</head>
<body class="page-wrapper">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">
        <img src="/assets/images/dublon_logo_final.png" alt="Dublon" style="height:40px;display:block;">
      </a>
      <ul class="navbar-links">
        <li><a href="catalogo.html" class="active">Produtos</a></li>
        <li><a href="servicos.html">Serviços</a></li>
        <li><a href="sobre.html">Sobre</a></li>
      </ul>
      <div class="navbar-search">
        <span class="search-icon">🔍</span>
        <input type="search" placeholder="Buscar produto..." />
      </div>
      <div class="navbar-actions">
        <a href="contato.html" class="navbar-btn-contact">Contato</a>
        <a href="login.html" class="navbar-btn-login"><span>👤</span> Entrar</a>
        <a href="carrinho.html" class="navbar-btn-cart" title="Carrinho">🛒<span class="cart-badge" style="display:none;">0</span></a>
        <a href="orcamento.html" class="navbar-btn-quote">Solicitar Orçamento</a>
        <a href="rastreamento.html" class="navbar-btn-track"><span>📦</span> Acompanhe seu pedido</a>
      </div>
    </div>
  </nav>

  <div class="catalog-layout">
    <!-- SIDEBAR -->
    <aside class="catalog-sidebar">
      <div class="catalog-sidebar-title">Filtros</div>

      <div class="filter-group" id="category-filters">
        <div class="filter-group-title">Categoria</div>
        <div style="font-size:12px;color:var(--text-secondary);">Carregando categorias...</div>
      </div>

      <div class="filter-divider"></div>

      <div class="filter-group" id="density-filters">
        <div class="filter-group-title">Densidade</div>
        <div class="filter-option"><input type="checkbox" id="f-d35" data-density="D35 kg/m²" /><label for="f-d35">D35</label></div>
        <div class="filter-option"><input type="checkbox" id="f-d45" data-density="D45 kg/m²" /><label for="f-d45">D45</label></div>
        <div class="filter-option"><input type="checkbox" id="f-d50" data-density="D50 kg/m²" /><label for="f-d50">D50</label></div>
        <div class="filter-option"><input type="checkbox" id="f-d60" data-density="D60 kg/m²" /><label for="f-d60">D60</label></div>
      </div>

      <div class="filter-divider"></div>

      <div class="filter-group">
        <div class="filter-group-title">Faixa de preço</div>
        <div class="price-range">
          <input type="range" min="0" max="300" value="300" id="price-range" />
          <div class="price-range-values">
            <span>R$ 0,00</span>
            <span id="price-max">R$ 300,00</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="catalog-main">
      <div class="catalog-header">
        <div>
          <h1>Catálogo de Produtos</h1>
          <p id="product-count-text">0 produtos encontrados</p>
        </div>
        <div class="catalog-sort">
          <label>Ordenar por:</label>
          <select id="catalog-sort-select">
            <option value="relevant">Mais relevantes</option>
            <option value="price-asc">Menor preço</option>
            <option value="price-desc">Maior preço</option>
            <option value="rating">Mais bem avaliados</option>
          </select>
        </div>
      </div>

      <div class="product-grid" id="product-grid">
        <!-- Carregado dinamicamente -->
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!window.API) return;

      const { ProductsAPI, CategoriesAPI, Format } = window.API;

      const productGrid = document.getElementById('product-grid');
      const productCountText = document.getElementById('product-count-text');
      const sortSelect = document.getElementById('catalog-sort-select');
      const categoryFiltersContainer = document.getElementById('category-filters');

      let allProducts = [];
      let categories = [];
      let selectedCategories = [];
      let selectedDensities = [];
      let maxPrice = 300.00;

      async function loadCategories() {
        try {
          const res = await CategoriesAPI.list();
          categories = res.categories || res || [];
          renderCategories(categories);
        } catch (e) {
          console.error('Erro ao carregar categorias:', e);
        }
      }

      function renderCategories(cats) {
        categoryFiltersContainer.innerHTML = '<div class="filter-group-title">Categoria</div>';
        cats.forEach(cat => {
          const opt = document.createElement('div');
          opt.className = 'filter-option';
          opt.innerHTML = `
            <input type="checkbox" id="cat-${cat.id}" data-id="${cat.id}" />
            <label for="cat-${cat.id}">${cat.name}</label>
          `;
          opt.querySelector('input').addEventListener('change', (e) => {
            const catId = parseInt(e.target.dataset.id);
            if (e.target.checked) {
              selectedCategories.push(catId);
            } else {
              selectedCategories = selectedCategories.filter(id => id !== catId);
            }
            filterAndRender();
          });
          categoryFiltersContainer.appendChild(opt);
        });
      }

      async function fetchProducts() {
        productGrid.innerHTML = '<div style="grid-column:span 3;text-align:center;padding:40px;color:var(--text-secondary);">Carregando catálogo...</div>';
        try {
          const res = await ProductsAPI.list({ limit: 100 });
          allProducts = res.products || res || [];
          filterAndRender();
        } catch (e) {
          productGrid.innerHTML = '<div style="grid-column:span 3;text-align:center;padding:40px;color:var(--text-secondary);">Erro ao carregar catálogo de produtos.</div>';
        }
      }

      function filterAndRender() {
        let filtered = [...allProducts];

        if (selectedCategories.length > 0) {
          filtered = filtered.filter(p => selectedCategories.includes(p.category_id));
        }

        if (selectedDensities.length > 0) {
          filtered = filtered.filter(p => selectedDensities.includes(p.density));
        }

        filtered = filtered.filter(p => parseFloat(p.price) <= maxPrice);

        const sortVal = sortSelect.value;
        if (sortVal === 'price-asc') {
          filtered.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
        } else if (sortVal === 'price-desc') {
          filtered.sort((a, b) => parseFloat(b.price) - parseFloat(a.price));
        } else if (sortVal === 'rating') {
          filtered.sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0));
        }

        renderProducts(filtered);
      }

      function renderProducts(products) {
        productCountText.textContent = `${products.length} produto(s) encontrado(s)`;
        
        if (products.length === 0) {
          productGrid.innerHTML = '<div style="grid-column:span 3;text-align:center;padding:40px;color:var(--text-secondary);">Nenhum produto atende aos filtros selecionados.</div>';
          return;
        }

        productGrid.innerHTML = '';
        products.forEach(p => {
          const mainImg = p.images && p.images.find(img => img.is_main) || (p.images && p.images[0]) || { image_url: '' };
          
          let badgeHtml = '';
          if (p.is_new) {
            badgeHtml = '<span class="product-card-badge"><span class="badge badge-blue">Novidade</span></span>';
          } else if (p.rating >= 4.5) {
            badgeHtml = '<span class="product-card-badge"><span class="badge badge-purple">Mais vendido</span></span>';
          }

          const card = document.createElement('a');
          card.href = `produto.html?id=${p.id}`;
          card.className = 'product-card';
          card.style.textDecoration = 'none';
          card.innerHTML = `
            <div class="product-card-img" style="background: linear-gradient(145deg, var(--gray-100) 0%, var(--gray-50) 100%); height: 180px;">
              ${mainImg.image_url ? `<img src="${mainImg.image_url}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;" />` : '👟'}
              ${badgeHtml}
            </div>
            <div class="product-card-body">
              <div class="product-card-cat">${p.category_name || 'Geral'}</div>
              <div class="product-card-name">${p.name}</div>
              <div class="product-card-specs" style="margin-top:6px; margin-bottom:12px; display:flex; gap:6px; flex-wrap:wrap;">
                ${p.density ? `<span class="spec-tag" style="padding: 2px 8px; background: var(--gray-100); border-radius: 100px; font-size: 10px; font-weight: 600; color: var(--text-secondary);">${p.density}</span>` : ''}
                ${p.material ? `<span class="spec-tag" style="padding: 2px 8px; background: var(--gray-100); border-radius: 100px; font-size: 10px; font-weight: 600; color: var(--text-secondary);">${p.material}</span>` : ''}
              </div>
              <div class="product-card-footer" style="display:flex; justify-content:space-between; align-items:center;">
                <div class="product-price" style="display:flex; flex-direction:column;">
                  <span class="product-price-label" style="font-size:10px; color:var(--text-muted);">A partir de</span>
                  <span class="product-price-value" style="font-size:16px; font-weight:800; color:var(--text-primary);">${Format.currency(p.price)}<span class="product-price-unit" style="font-size:11px; font-weight:400; color:var(--text-secondary);">/par</span></span>
                </div>
                <button class="btn-add-cart">+</button>
              </div>
            </div>
          `;
          productGrid.appendChild(card);
        });
      }

      sortSelect.addEventListener('change', () => filterAndRender());

      document.querySelectorAll('#density-filters input').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const densityVal = e.target.dataset.density;
          if (e.target.checked) {
            selectedDensities.push(densityVal);
          } else {
            selectedDensities = selectedDensities.filter(d => d !== densityVal);
          }
          filterAndRender();
        });
      });

      const priceRange = document.getElementById('price-range');
      const priceMaxVal = document.getElementById('price-max');
      
      priceRange.addEventListener('input', (e) => {
        const value = parseFloat(e.target.value);
        maxPrice = value;
        priceMaxVal.textContent = Format.currency(value);
        filterAndRender();
      });

      await loadCategories();
      await fetchProducts();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar Produto – DUBLON</title>
  <meta name="description" content="Cadastrar ou editar produtos no catálogo DUBLON." />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <style>
    /* Custom Admin Layout */
    .admin-layout {
      display: flex;
      min-height: 100vh;
      background: var(--gray-50);
    }
    
    .admin-sidebar {
      width: 240px;
      background: var(--blue-dark);
      color: var(--white);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.08);
    }

    .admin-sidebar-header {
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .admin-sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 20px 12px;
      flex: 1;
    }

    .admin-sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      color: rgba(255,255,255,0.7);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 500;
      transition: all var(--transition);
    }

    .admin-sidebar-item:hover {
      background: rgba(255,255,255,0.05);
      color: var(--white);
    }

    .admin-sidebar-item.active {
      background: var(--blue-vibrant);
      color: var(--white);
      font-weight: 600;
    }

    .admin-sidebar-item .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .admin-sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .admin-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .admin-header {
      height: 64px;
      background: var(--white);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .admin-content {
      padding: 32px;
      flex: 1;
      max-width: 1000px;
    }

    /* Product Form Layout */
    .form-section {
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .form-section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    /* Image upload box */
    .upload-area {
      border: 2px dashed var(--gray-300);
      border-radius: var(--radius-lg);
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      background: var(--gray-50);
    }

    .upload-area:hover {
      border-color: var(--blue-vibrant);
      background: #EFF6FF;
    }

    .upload-icon {
      font-size: 32px;
      margin-bottom: 12px;
      color: var(--gray-400);
    }

    .upload-text {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .upload-text strong {
      color: var(--blue-vibrant);
    }

    .image-preview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1;
      background: var(--gray-100);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      overflow: hidden;
    }

    .preview-item-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      background: var(--red-error);
      color: var(--white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }

    /* Variations checkbox lists */
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 8px;
    }

    .size-checkbox {
      position: relative;
    }

    .size-checkbox input {
      opacity: 0;
      position: absolute;
      inset: 0;
      cursor: pointer;
    }

    .size-label {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all var(--transition);
    }

    .size-checkbox input:checked + .size-label {
      background: var(--blue-dark);
      color: var(--white);
      border-color: var(--blue-dark);
    }

    /* Colors selector */
    .color-checkbox-list {
      display: flex;
      gap: 12px;
    }

    .color-dot-wrap {
      position: relative;
      width: 32px;
      height: 32px;
    }

    .color-dot-wrap input {
      opacity: 0;
      position: absolute;
      inset: 0;
      cursor: pointer;
      z-index: 2;
    }

    .color-dot {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      box-shadow: 0 0 0 1px var(--gray-300);
      transition: all var(--transition);
    }

    .color-dot-wrap input:checked + .color-dot {
      border-color: var(--white);
      box-shadow: 0 0 0 2px var(--blue-vibrant);
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="admin-layout">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <img src="/assets/images/dublon_logo_final.png" alt="Dublon" style="height:40px;display:block;">
      </div>
      <nav class="admin-sidebar-nav">
        <a href="dashboard.html" class="admin-sidebar-item">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a href="produtos.html" class="admin-sidebar-item">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          Produtos
        </a>
        <a href="produto-novo.html" class="admin-sidebar-item active">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Novo Produto
        </a>
        <a href="pedidos.html" class="admin-sidebar-item">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          Pedidos
        </a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../index.html" class="admin-sidebar-item" style="color:var(--cyan-accent);">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          Voltar ao site
        </a>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
      <!-- HEADER -->
      <header class="admin-header">
        <div class="admin-header-title">
          <h2 style="font-size:18px;font-weight:700;color:var(--text-primary);" id="pageFormTitle">Cadastrar Produto</h2>
        </div>
      </header>

      <!-- CONTENT -->
      <div class="admin-content">
        <form onsubmit="saveProduct(event)">
          <!-- BASIC INFO -->
          <div class="form-section">
            <h3 class="form-section-title">Informações Básicas</h3>
            <div class="form-group" style="margin-bottom: 20px;">
              <label class="form-label" for="prodName">Nome do Produto</label>
              <input type="text" class="form-control" id="prodName" placeholder="Ex: Palmilha EVA Pro D45" required />
            </div>
            
            <div class="form-row" style="margin-bottom: 20px;">
              <div class="form-group">
                <label class="form-label" for="prodSku">Código SKU</label>
                <input type="text" class="form-control" id="prodSku" placeholder="Ex: DBL-EVA-D45" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="prodCategory">Categoria</label>
                <select class="form-control" id="prodCategory" required>
                  <option value="">Selecionar categoria</option>
                  <option value="eva">EVA Industrial</option>
                  <option value="premium">Premium Couro</option>
                  <option value="esportiva">Esportiva</option>
                  <option value="ortopedica">Ortopédica</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="prodPrice">Preço Base (R$)</label>
                <input type="text" class="form-control" id="prodPrice" placeholder="Ex: 439,60" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="prodPromo">Preço Promocional (R$)</label>
                <input type="text" class="form-control" id="prodPromo" placeholder="Se aplicável..." />
              </div>
            </div>
          </div>

          <!-- IMAGES -->
          <div class="form-section">
            <h3 class="form-section-title">Imagens do Produto</h3>
            <div class="upload-area" onclick="triggerUpload()">
              <div class="upload-icon">📁</div>
              <div class="upload-text">Arraste a imagem aqui ou <strong>clique para escolher</strong></div>
              <input type="file" id="fileSelector" style="display:none;" onchange="handleImageSelection(event)" />
            </div>
            
            <div class="image-preview-grid" id="imagePreviewGrid">
              <div class="preview-item">
                👟
                <span class="preview-item-remove" onclick="removeImage(this)">×</span>
              </div>
              <div class="preview-item">
                🥾
                <span class="preview-item-remove" onclick="removeImage(this)">×</span>
              </div>
            </div>
          </div>

          <!-- ESTOQUE E VARIAÇÕES -->
          <div class="form-section">
            <h3 class="form-section-title">Estoque e Variações</h3>
            <div class="form-row" style="margin-bottom: 24px;">
              <div class="form-group">
                <label class="form-label" for="prodStock">Estoque Disponível (pares)</label>
                <input type="number" class="form-control" id="prodStock" placeholder="Ex: 250" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="prodStatus">Status do Produto</label>
                <select class="form-control" id="prodStatus">
                  <option value="ativo">Ativo (visível no catálogo)</option>
                  <option value="inativo">Inativo (rascunho)</option>
                </select>
              </div>
            </div>

            <!-- Tamanhos -->
            <div class="form-group" style="margin-bottom: 24px;">
              <label class="form-label">Tamanhos Disponíveis</label>
              <div class="checkbox-grid">
                <div class="size-checkbox"><input type="checkbox" checked /><span class="size-label">34</span></div>
                <div class="size-checkbox"><input type="checkbox" checked /><span class="size-label">35</span></div>
                <div class="size-checkbox"><input type="checkbox" checked /><span class="size-label">36</span></div>
                <div class="size-checkbox"><input type="checkbox" checked /><span class="size-label">37</span></div>
                <div class="size-checkbox"><input type="checkbox" checked /><span class="size-label">38</span></div>
                <div class="size-checkbox"><input type="checkbox" checked /><span class="size-label">39</span></div>
                <div class="size-checkbox"><input type="checkbox" checked /><span class="size-label">40</span></div>
                <div class="size-checkbox"><input type="checkbox" checked /><span class="size-label">41</span></div>
                <div class="size-checkbox"><input type="checkbox" checked /><span class="size-label">42</span></div>
                <div class="size-checkbox"><input type="checkbox" checked /><span class="size-label">43</span></div>
                <div class="size-checkbox"><input type="checkbox" /><span class="size-label">44</span></div>
              </div>
            </div>

            <!-- Cores -->
            <div class="form-group">
              <label class="form-label">Cores Disponíveis</label>
              <div class="color-checkbox-list">
                <div class="color-dot-wrap">
                  <input type="checkbox" checked />
                  <span class="color-dot" style="background:#081428;"></span>
                </div>
                <div class="color-dot-wrap">
                  <input type="checkbox" checked />
                  <span class="color-dot" style="background:#3B82F6;"></span>
                </div>
                <div class="color-dot-wrap">
                  <input type="checkbox" />
                  <span class="color-dot" style="background:#22C55E;"></span>
                </div>
                <div class="color-dot-wrap">
                  <input type="checkbox" />
                  <span class="color-dot" style="background:#EF4444;"></span>
                </div>
                <div class="color-dot-wrap">
                  <input type="checkbox" checked />
                  <span class="color-dot" style="background:#E2E8F0;"></span>
                </div>
              </div>
            </div>
          </div>

          <!-- DESCRIÇÃO -->
          <div class="form-section">
            <h3 class="form-section-title">Descrição e Especificações Técnicas</h3>
            <div class="form-group" style="margin-bottom: 20px;">
              <label class="form-label" for="prodDesc">Descrição Detalhada</label>
              <textarea class="form-control" id="prodDesc" placeholder="Descreva os benefícios, materiais e indicações do produto..."></textarea>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="prodThickness">Espessura (mm)</label>
                <input type="text" class="form-control" id="prodThickness" placeholder="Ex: 4mm a 8mm" />
              </div>
              <div class="form-group">
                <label class="form-label" for="prodDensity">Densidade (D)</label>
                <input type="text" class="form-control" id="prodDensity" placeholder="Ex: D45 Shore A" />
              </div>
            </div>
          </div>

          <!-- SUBMIT ACTIONS -->
          <div class="flex gap-4" style="justify-content: flex-end; margin-bottom: 40px;">
            <a href="produtos.html" class="btn btn-white">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar Produto</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    // Dinamicamente carrega dados para edição se houver ?id= na URL
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const prodId = urlParams.get('id');
      
      if (prodId) {
        document.getElementById('pageFormTitle').textContent = 'Editar Produto';
        document.title = 'Editar Produto – DUBLON';
        
        // Mock data base para preenchimento
        const mockProducts = {
          "1": {
            name: "Palmilha EVA Pro D45",
            sku: "DBL-EVA-D45",
            category: "eva",
            price: "439,60",
            promo: "",
            stock: 350,
            status: "ativo",
            desc: "Palmilha de EVA com alta resiliência e densidade calibrada para uso industrial e esportivo de alto impacto.",
            thickness: "5mm",
            density: "D45 Shore A"
          },
          "2": {
            name: "Palmilha Premium +600",
            sku: "DBL-PRM-600",
            category: "premium",
            price: "359,70",
            promo: "299,90",
            stock: 180,
            status: "ativo",
            desc: "Desenvolvida com forração em couro nobre e base anatômica para máximo conforto durante o dia todo.",
            thickness: "3mm",
            density: "D30 Shore A"
          },
          "3": {
            name: "Palmilha Esportiva Runner",
            sku: "DBL-SPT-RUN",
            category: "esportiva",
            price: "289,70",
            promo: "",
            stock: 12,
            status: "ativo",
            desc: "Amortecimento e impulso combinados em um design leve focado em calçados de corrida e caminhada.",
            thickness: "6mm",
            density: "D35 Shore A"
          }
        };

        const prodData = mockProducts[prodId];
        if (prodData) {
          document.getElementById('prodName').value = prodData.name;
          document.getElementById('prodSku').value = prodData.sku;
          document.getElementById('prodCategory').value = prodData.category;
          document.getElementById('prodPrice').value = prodData.price;
          document.getElementById('prodPromo').value = prodData.promo;
          document.getElementById('prodStock').value = prodData.stock;
          document.getElementById('prodStatus').value = prodData.status;
          document.getElementById('prodDesc').value = prodData.desc;
          document.getElementById('prodThickness').value = prodData.thickness;
          document.getElementById('prodDensity').value = prodData.density;
        }
      }
    });

    function triggerUpload() {
      document.getElementById('fileSelector').click();
    }

    function handleImageSelection(event) {
      const files = event.target.files;
      if (files.length > 0) {
        const grid = document.getElementById('imagePreviewGrid');
        const newItem = document.createElement('div');
        newItem.className = 'preview-item';
        newItem.innerHTML = `
          📦
          <span class="preview-item-remove" onclick="removeImage(this)">×</span>
        `;
        grid.appendChild(newItem);
      }
    }

    function removeImage(btn) {
      btn.closest('.preview-item').remove();
    }

    function saveProduct(event) {
      event.preventDefault();
      alert('Produto salvo com sucesso no catálogo!');
      window.location.href = 'produtos.html';
    }
  </script>
</body>
</html>
